# Будильник для облака.
#
# Бесплатный проект Supabase засыпает после недели без обращений: летние
# каникулы — и в понедельник никто не войдёт, пока кто-то не разбудит его
# руками в панели. Раз в три дня дёргаем один лёгкий запрос — этого хватает,
# чтобы проект считался живым.
#
# Ключ здесь открытый: тот же, что лежит внутри приложения и сайта. Данные он
# не открывает — их закрывают права доступа в самой базе.

name: Будим облако

on:
  schedule:
    # Каждые три дня в 6 утра по Москве (3:00 UTC).
    - cron: '0 3 */3 * *'
  # Кнопка «запустить вручную» на случай проверки.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Лёгкий запрос к базе
        run: |
          код=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://jkvhgzihitldqysxjaha.supabase.co/rest/v1/exercises?select=id&limit=1" \
            -H "apikey: sb_publishable_NCCnogT1ZSm7xaaBy2iR-A_U3Pj0BHc" \
            -H "Authorization: Bearer sb_publishable_NCCnogT1ZSm7xaaBy2iR-A_U3Pj0BHc")
          echo "база ответила: $код"
          test "$код" = "200"
